name: Build DLMS Mini APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build DLMS Mini APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -oq dlms_work.zip -d extracted
          PROJECT_DIR="extracted/dlms_work"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan di $PROJECT_DIR"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        working-directory: extracted/dlms_work
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Grant Gradle permission
        working-directory: extracted/dlms_work
        run: chmod +x gradlew

      - name: Verify Gradle
        working-directory: extracted/dlms_work
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: extracted/dlms_work
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        working-directory: extracted/dlms_work
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            find . -type f -name "*.apk"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-APK
          path: extracted/dlms_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
