
name: Build DLMS Mini APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Grant execute permission
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Check project files
        run: |
          echo "Project directory:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \)

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

      - name: Find APK
        run: |
          echo "APK hasil build:"
          find . -type f -name "*.apk"

          if ! find . -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
