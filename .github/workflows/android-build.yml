
name: Build DLMS Mini APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DLMS Mini APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "dlms_work.zip" ]; then
            echo "ERROR: dlms_work.zip tidak ditemukan"
            exit 1
          fi

          mkdir -p extracted

          unzip -oq dlms_work.zip -d extracted

          echo "Project extracted:"
          find extracted -maxdepth 3 -type f | sort

          if [ ! -f "extracted/dlms_work/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          if [ ! -f "extracted/dlms_work/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan"
            exit 1
          fi

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      # 7. Generate Gradle Wrapper
      - name: Generate Gradle Wrapper
        working-directory: extracted/dlms_work
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      # 8. Grant permission
      - name: Grant Gradle permission
        working-directory: extracted/dlms_work
        run: chmod +x gradlew

      # 9. Verify configuration
      - name: Verify Gradle
        working-directory: extracted/dlms_work
        run: |
          ./gradlew --version

      # 10. Build APK
      - name: Build Debug APK
        working-directory: extracted/dlms_work
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # 11. Verify APK
      - name: Verify APK
        working-directory: extracted/dlms_work
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat"
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload DLMS Mini APK
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-APK
          path: extracted/dlms_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
