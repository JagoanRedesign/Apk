
name: Build DLMS Mini APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."
          ls -lah

          ZIP_FILE=""

          if [ -f "dlms_work.zip" ]; then
            ZIP_FILE="dlms_work.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi

          echo "Searching for Gradle wrapper..."

          GRADLE_FILE=$(find . -type f -name gradlew \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Grant execute permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -type f -name "*.apk"

          if ! find . -type f -path "*/outputs/apk/*" \
            -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
