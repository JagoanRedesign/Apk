name: Build DLMS Mini APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build DLMS Mini APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract Android project
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          if [ ! -f dlms_work.zip ]; then
            echo "ERROR: dlms_work.zip tidak ditemukan di root repository"
            ls -la
            exit 1
          fi

          unzip -oq dlms_work.zip -d extracted

          PROJECT_DIR="extracted/dlms_work"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan di $PROJECT_DIR"
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project Android ditemukan: $PROJECT_DIR"

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Check Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan: $SDKMANAGER"
            find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          "$SDKMANAGER" --version

      # 5. Accept SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 6. Install Android SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Generate Gradle Wrapper
      - name: Generate Gradle Wrapper
        working-directory: extracted/dlms_work
        run: |
          gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      # 9. Grant permission
      - name: Grant Gradle permission
        working-directory: extracted/dlms_work
        run: chmod +x gradlew

      # 10. Verify Gradle
      - name: Verify Gradle
        working-directory: extracted/dlms_work
        run: ./gradlew --version

      # 11. Build APK
      - name: Build Debug APK
        working-directory: extracted/dlms_work
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # 12. Verify APK
      - name: Verify APK
        working-directory: extracted/dlms_work
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan atau kosong"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"

      # 13. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-APK
          path: extracted/dlms_work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
