name: Build DLMS Mini Equalizer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build DLMS Mini Equalizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # sdkmanager berada di direktori SDK milik runner.
      # Jangan chmod file SDK: direktori tersebut dapat bersifat read-only.
      # Jalankan skrip sdkmanager melalui bash.
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME" || { echo "Android SDK tidak ditemukan: $ANDROID_HOME"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            find "$ANDROID_HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Menggunakan: $SDKMANAGER"
          bash "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | bash "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Peringatan: proses penerimaan lisensi mengembalikan kode $LICENSE_STATUS"
          fi

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          bash "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f dlms_work.zip || { echo "dlms_work.zip tidak ditemukan di root repository"; exit 1; }
          mkdir -p extracted
          unzip -oq dlms_work.zip -d extracted
          PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 5 -type f -name settings.gradle.kts -printf '%h\\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "settings.gradle.kts tidak ditemukan dalam ZIP"; find extracted -maxdepth 6 -type f; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "app/build.gradle.kts tidak ditemukan"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "APK tidak ditemukan atau kosong"; find app/build/outputs -type f 2>/dev/null || true; exit 1; }
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-Mini-Equalizer-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
